<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCONET — Training Console</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles-landing.css">
  <style>
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #0d0d17;
      --panel-bg: rgba(15, 15, 22, 0.6);
      --panel-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(20, 20, 30, 0.55);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --accent: rgba(96, 180, 255, 0.8);
      --accent-dim: rgba(96, 180, 255, 0.2);
      --success: rgba(76, 207, 160, 0.9);
      --error-color: rgba(255, 90, 90, 0.9);
    }
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(10, 10, 18, 0.7); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-logo { font-family: 'SF Mono'; font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 2px; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-link { font-size: 11px; color: var(--text-secondary); text-decoration: none; padding: 6px 12px; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; }
    .nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--text-primary); background: rgba(96,180,255,0.1); }
    .user-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-secondary); padding: 6px 12px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--panel-border); }
    .user-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--error-color); padding: 6px 12px; border-radius: 10px; font-size: 11px; cursor: pointer; transition: all 0.3s ease; }
    .logout-btn:hover { background: rgba(255,90,90,0.1); }

    .training-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 52px;
      padding: 16px;
      max-height: calc(100vh - 64px);
      overflow-y: auto;
    }
    .metric-card {
      background: var(--glass-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 20px;
    }
    .metric-card.full { grid-column: 1 / -1; }
    .metric-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      font-family: 'SF Mono', monospace;
    }
    .metric-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .metric-value.success { color: var(--success); }
    .metric-value.warning { color: var(--warning); }
    .loss-chart {
      height: 160px;
      position: relative;
      margin-top: 12px;
    }
    .loss-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(96,180,255,0.1), transparent);
    }
    .loss-bar-container {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      height: 120px;
      margin-top: 12px;
      overflow: hidden;
    }
    .loss-bar {
      flex: 1;
      background: linear-gradient(180deg, var(--accent-dim), var(--accent));
      border-radius: 2px 2px 0 0;
      min-height: 2px;
      transition: height 0.3s ease;
    }
    .loss-bar.low { background: linear-gradient(180deg, rgba(76,207,160,0.2), var(--success)); }
    .progress-bar-container {
      margin-top: 16px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s ease;
    }
    .training-log-entry {
      font-family: 'SF Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
      line-height: 1.6;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .training-log-entry.completed { color: var(--success); }
    .training-log-entry.active { color: var(--accent); }
    .auto-train-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(76, 207, 160, 0.1);
      border: 1px solid rgba(76, 207, 160, 0.3);
      border-radius: 10px;
      font-size: 10px;
      color: var(--success);
    }
    .auto-train-badge.off {
      background: rgba(255, 90, 90, 0.1);
      border-color: rgba(255, 90, 90, 0.3);
      color: var(--error-color);
    }
  </style>
</head>
<body>
  <div class="space-bg">
    <div class="starfield" id="starfield"></div>
    <div class="gradient-overlay"></div>
  </div>

  <nav class="nav-bar">
    <div class="nav-logo">ARCONET</div>
    <div class="nav-links">
      <a class="nav-link" onclick="window.location.href='/dashboard.html'">Recovery</a>
      <a class="nav-link" onclick="window.location.href='/devices.html'">Devices</a>
      <a class="nav-link active" onclick="window.location.href='/training.html'">Training</a>
      <a class="nav-link" onclick="window.location.href='/index.html#docs'">Docs</a>
      <span class="user-badge"><span class="user-dot"></span><span id="userName">Loading...</span></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="training-grid">
    <div class="metric-card">
      <div class="metric-title">Training Status</div>
      <div class="metric-value" id="trainingStatus">IDLE</div>
      <div class="metric-sub" id="glimmerStatus">Glimmer VM: Loading...</div>
    </div>

    <div class="metric-card">
      <div class="metric-title">Current Step</div>
      <div class="metric-value" id="currentStep">0</div>
      <div class="metric-sub">of 1000 target</div>
    </div>

    <div class="metric-card">
      <div class="metric-title">Loss</div>
      <div class="metric-value" id="lossValue">—</div>
      <div class="metric-sub">target: &lt; 0.001</div>
    </div>

    <div class="metric-card">
      <div class="metric-title">Accuracy</div>
      <div class="metric-value" id="accuracyValue">0%</div>
      <div class="metric-sub">template prediction</div>
    </div>

    <div class="metric-card full">
      <div class="metric-title">Loss Trend (last 50 steps)</div>
      <div class="loss-bar-container" id="lossBars"></div>
    </div>

    <div class="metric-card full">
      <div class="metric-title">Training Controls</div>
      <div class="progress-bar-container">
        <div class="progress-bar"><div class="progress-fill" id="trainingProgress"></div></div>
        <div class="progress-text">
          <span id="progressPercent">0%</span>
          <span id="statusText">Ready to start</span>
        </div>
      </div>
      <div style="display:flex; gap:12px; margin-top:16px;">
        <button class="action-btn primary" style="flex:1; padding:14px;" onclick="startTraining()">Start Auto-Training</button>
        <button class="action-btn" style="flex:1; padding:14px;" onclick="stopTraining()">Stop</button>
        <button class="action-btn" style="flex:1; padding:14px;" onclick="runStep()">Single Step (50)</button>
      </div>
    </div>

    <div class="metric-card full">
      <div class="metric-title">Training Log</div>
      <div id="trainingLog">
        <div class="training-log-entry">Waiting for training to begin...</div>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('arconet_token') || '';
    const user = JSON.parse(localStorage.getItem('arconet_user') || '{}');
    document.getElementById('userName').textContent = user.name || user.email || 'User';

    function logout() {
      fetch('/api/auth?op=logout', { method: 'POST', headers: { Authorization: `Bearer ${token}` } })
        .then(() => { localStorage.removeItem('arconet_token'); localStorage.removeItem('arconet_user'); window.location.href = '/login.html'; });
    }

    if (!token) { window.location.href = '/login.html'; }

    let autoTrainInterval = null;
    let logEntries = [];

    function log(message, type = 'default') {
      const ts = new Date().toTimeString().slice(0, 8);
      logEntries.push({ text: `[${ts}] — ${message}`, type });
      if (logEntries.length > 50) logEntries.shift();
      renderLogs();
    }

    function renderLogs() {
      const container = document.getElementById('trainingLog');
      container.innerHTML = logEntries.slice(-30).reverse().map(e =>
        `<div class="training-log-entry ${e.type}">${e.text}</div>`
      ).join('');
    }

    async function fetchState() {
      try {
        const res = await fetch('/api/auth?op=training-state', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        updateUI(data.training);
      } catch (e) {
        console.error('State fetch error:', e);
      }
    }

    function updateUI(training) {
      document.getElementById('currentStep').textContent = training.currentStep;
      document.getElementById('lossValue').textContent = training.loss !== null ? training.loss.toFixed(6) : '—';

      const accEl = document.getElementById('accuracyValue');
      if (training.accuracy !== undefined) {
        accEl.textContent = `${Math.round(training.accuracy * 100)}%`;
        accEl.className = 'metric-value ' + (training.accuracy > 0.8 ? 'success' : training.accuracy > 0.5 ? 'warning' : '');
      }

      document.getElementById('progressPercent').textContent = `${Math.round(training.currentStep / 1000 * 100)}%`;
      document.getElementById('trainingProgress').style.width = `${Math.min(100, training.currentStep / 1000 * 100)}%`;
      document.getElementById('statusText').textContent = training.isTraining ? 'Training active' : training.converged ? 'Converged' : 'Idle';
      document.getElementById('trainingStatus').textContent = training.isTraining ? 'TRAINING' : training.converged ? 'CONVERGED' : 'IDLE';
      document.getElementById('trainingStatus').style.color = training.isTraining ? 'var(--accent)' : training.converged ? 'var(--success)' : 'var(--text-secondary)';

      const glimmerEl = document.getElementById('glimmerStatus');
      glimmerEl.textContent = `Glimmer VM: ${training.glimmerAvailable ? 'Available' : 'Fallback'}`;
      glimmerEl.style.color = training.glimmerAvailable ? 'var(--success)' : 'var(--text-secondary)';

      if (training.lossHistory && training.lossHistory.length > 0) {
        const bars = training.lossHistory.slice(-50).map(loss => {
          const height = Math.max(2, (1 - loss) * 120);
          const low = loss < 0.05;
          return `<div class="loss-bar ${low ? 'low' : ''}" style="height: ${height}px;"></div>`;
        }).join('');
        document.getElementById('lossBars').innerHTML = bars;
      }
    }

    async function startTraining() {
      try {
        const res = await fetch('/api/auth?op=training-start', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        log(data.message || 'Training started', 'active');
      } catch (e) {
        log('Error starting training', 'default');
      }
      startAutoTrain();
    }

    function startAutoTrain() {
      if (autoTrainInterval) clearInterval(autoTrainInterval);
      autoTrainInterval = setInterval(async () => {
        try {
          await fetch('/api/auth?op=training-step', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: JSON.stringify({ steps: 50 })
          });
          log('Auto-training step: 50 iterations', 'active');
        } catch (e) {
          log(`Training step error: ${e.message}`, 'default');
        }
        await fetchState();
      }, 2000);
    }

    async function stopTraining() {
      clearInterval(autoTrainInterval);
      autoTrainInterval = null;
      try {
        const res = await fetch('/api/auth?op=training-stop', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        log(data.message || 'Training stopped', 'completed');
      } catch (e) {}
      await fetchState();
    }

    async function runStep() {
      try {
        const res = await fetch('/api/auth?op=training-step', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: JSON.stringify({ steps: 50 })
        });
        const data = await res.json();
        log(`Step: ${data.stepsCompleted} iterations, loss: ${data.loss ? data.loss.toFixed(6) : '?'}, acc: ${Math.round((data.accuracy || 0) * 100)}%`, 'active');
        await fetchState();
      } catch (e) {
        log('Step error', 'default');
      }
    }

    async function initSession() {
        try {
        const res = await fetch('/api/auth?op=session', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) {
          localStorage.removeItem('arconet_token');
          localStorage.removeItem('arconet_user');
          window.location.href = '/login.html';
        }
      } catch (e) {}
    }

    // Init
    initSession();
    fetchState();
    setInterval(() => fetchState(), 5000);

    function initStarfield() {
      const sf = document.getElementById('starfield');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.style.cssText = `position:absolute;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:rgba(255,255,255,${Math.random()*0.4+0.1});border-radius:50%;animation:twinkle ${Math.random()*3+1}s infinite infinite;`;
        sf.appendChild(s);
      }
      const style = document.createElement('style');
      style.textContent = '@keyframes twinkle{0%,100%{opacity:0.6}50%{opacity:1}}';
      document.head.appendChild(style);
    }
    initStarfield();
  </script>
</body>
</html>
