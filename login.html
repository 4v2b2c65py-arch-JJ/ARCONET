<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCONET — Login</title>
  <link rel="stylesheet" href="/styles-landing.css">
  <link rel="stylesheet" href="/styles-auth.css">
  <style>
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #0d0d17;
      --panel-bg: rgba(15, 15, 22, 0.6);
      --panel-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(20, 20, 30, 0.55);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --accent: rgba(96, 180, 255, 0.8);
      --accent-dim: rgba(96, 180, 255, 0.2);
      --success: rgba(76, 207, 160, 0.9);
      --error-color: rgba(255, 90, 90, 0.9);
    }
  </style>
</head>
<body>
  <div class="space-bg">
    <div class="starfield" id="starfield"></div>
    <div class="gradient-overlay"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">ARCONET</div>
        <div class="auth-title" id="authTitle">Welcome Back</div>
        <div class="auth-subtitle" id="authSubtitle">Sign in to access your recovery dashboard</div>
      </div>

      <form class="auth-form" id="authForm">
        <input type="hidden" id="authMode" value="login">

        <div class="form-group">
          <label class="form-label" for="nameInput">Full Name</label>
          <input class="form-input" type="text" id="nameInput" placeholder="Jane Doe" autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="emailInput">Email</label>
          <input class="form-input" type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="password-wrapper">
            <input class="form-input" type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle">○</button>
          </div>
        </div>

        <div class="form-error" id="formError"></div>

        <button type="submit" class="auth-submit" id="authSubmit">
          <span class="submit-text">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        <span class="toggle-mode" id="toggleMode">
          <span id="toggleText">Don't have an account?</span>
          <a href="#" id="toggleLink">Register</a>
        </span>
      </div>

      <div class="auth-links">
        <a href="/index.html" class="auth-link">← Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('authForm');
    const modeInput = document.getElementById('authMode');
    const titleEl = document.getElementById('authTitle');
    const subtitleEl = document.getElementById('authSubtitle');
    const submitText = document.querySelector('.submit-text');
    const nameGroup = document.querySelector('.form-group');
    const toggleLink = document.getElementById('toggleLink');
    const toggleText = document.getElementById('toggleText');
    const errorMsg = document.getElementById('formError');
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordInput = document.getElementById('passwordInput');

    let isLogin = true;

    const toggleAuth = () => {
      isLogin = !isLogin;
      modeInput.value = isLogin ? 'login' : 'register';
      if (isLogin) {
        titleEl.textContent = 'Welcome Back';
        subtitleEl.textContent = 'Sign in to access your recovery dashboard';
        submitText.textContent = 'Sign In';
        nameGroup.style.display = 'none';
        toggleText.textContent = "Don't have an account?";
        toggleLink.textContent = 'Register';
      } else {
        titleEl.textContent = 'Create Account';
        subtitleEl.textContent = 'Register to start managing your devices';
        submitText.textContent = 'Register';
        nameGroup.style.display = 'block';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign In';
      }
      errorMsg.textContent = '';
      form.reset();
    };

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      toggleAuth();
    });

    passwordToggle.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      passwordToggle.textContent = type === 'password' ? '○' : '●';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const name = document.getElementById('nameInput').value;
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      if (!email || !password) {
        errorMsg.textContent = 'Email and password are required';
        return;
      }

      if (!isLogin && !name) {
        errorMsg.textContent = 'Full name is required';
        return;
      }

      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.error || 'Authentication failed';
          return;
        }
        localStorage.setItem('arconet_token', data.token);
        localStorage.setItem('arconet_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = 'Network error — check connection';
      }
    });

    // Starfield
    const starfield = document.getElementById('starfield');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.style.cssText = `
        position: absolute; width: ${Math.random()*2+1}px; height: ${Math.random()*2+1}px;
        left: ${Math.random()*100}%; top: ${Math.random()*100}%;
        background: rgba(255,255,255,${Math.random()*0.6+0.2}); border-radius: 50%;
        animation: twinkle ${Math.random()*4+2}s infinite infinite;
      `;
      starfield.appendChild(star);
    }
    const style = document.createElement('style');
    style.textContent = '@keyframes twinkle{0%,100%{opacity:0.6}50%{opacity:1}}';
    document.head.appendChild(style);

    // Hide name field on load (login mode)
    nameGroup.style.display = 'none';

    // Check if already logged in
    const token = localStorage.getItem('arconet_token');
    if (token) {
      fetch('/api/auth/session', {
        headers: { Authorization: `Bearer ${token}` }
      }).then(r => {
        if (r.ok) window.location.href = '/dashboard.html';
      });
    }
  </script>
</body>
</html>
